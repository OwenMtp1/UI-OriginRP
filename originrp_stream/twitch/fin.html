<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Origin Roleplay – Fin de live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../commun/kit.css">
    <script src="../config.js"></script>
    <script src="../commun/kit.js"></script>
    <style>
        html, body { width: 1920px; height: 1080px; }
        .center { gap: 26px; }
        .title { font-size: 110px; margin-top: 8px; }
        .sub { font-size: 32px; }
        .row { display: flex; gap: 18px; margin-top: 16px; font-size: 26px; }
    </style>
</head>
<body class="anim">
    <div class="stage">
        <div class="bands"></div>
        <div class="streaks"></div>
        <div class="center">
            <div class="emblem" style="--e: 380px"></div>
            <h1 class="title">Merci d'avoir<br><em>regardé</em></h1>
            <p class="sub" data-f="À très vite sur {serveur} !"></p>
            <div class="row">
                <span class="pill" data-if="streamer"><span data-icon="heart"></span><span data-f="Pense à suivre {streamer}"></span></span>
                <span class="pill"><span data-icon="discord"></span><span data-k="discord"></span></span>
            </div>
        </div>
    </div>
</body>
</html>
