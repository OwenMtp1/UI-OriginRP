<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OriginRP Garage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="garage" class="garage hidden" data-position="center" role="dialog" aria-labelledby="g-title">
        <header class="g-header">
            <div class="g-logo">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.5 5.5A2 2 0 0 1 7.4 4h9.2a2 2 0 0 1 1.9 1.5L19.8 10h.2a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-1v1.5a1.5 1.5 0 0 1-3 0V18H7v1.5a1.5 1.5 0 0 1-3 0V18H3a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h.2zM7.6 6l-1 4h10.8l-1-4zM6.5 15.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm11 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill-rule="evenodd"/></svg>
            </div>
            <span class="g-divider"></span>
            <div class="g-heading">
                <h1 id="g-title"></h1>
                <p id="g-subtitle"></p>
            </div>
            <button id="g-close" class="g-key" type="button" aria-label="Fermer"><span>ESC</span></button>
        </header>

        <nav id="g-tabs" class="g-tabs"></nav>

        <ul id="g-list" class="g-list" role="listbox"></ul>

        <footer class="g-hints">
            <span class="hint"><kbd class="round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></kbd>Choisir</span>
            <span class="hint"><kbd class="round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v7a2 2 0 0 1-2 2H7"/><path d="m10 10.5-3.5 3.5 3.5 3.5"/></svg></kbd>Sortir</span>
            <span id="hint-tabs" class="hint"><kbd>⇆</kbd>Onglet</span>
            <span class="hint end"><kbd>ESC</kbd>Fermer</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
