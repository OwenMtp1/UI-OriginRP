<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OriginRP Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu" class="menu hidden" role="dialog" aria-labelledby="menu-title">
        <header class="menu-header">
            <div class="menu-brand">
                <button id="menu-back" class="menu-back" type="button" aria-label="Retour"></button>
                <div id="menu-logo" class="menu-logo"></div>
            </div>
            <span class="menu-divider"></span>
            <div class="menu-heading">
                <h1 id="menu-title" class="menu-title"></h1>
                <p id="menu-subtitle" class="menu-subtitle"></p>
            </div>
            <div id="menu-key" class="menu-key"><span></span></div>
            <div id="menu-counter" class="menu-counter"></div>
        </header>
        <ul id="menu-items" class="menu-items" role="menu"></ul>
        <footer id="menu-hints" class="menu-hints">
            <span class="hint"><kbd class="hint-round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></kbd>Choisir</span>
            <span class="hint"><kbd class="hint-round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v7a2 2 0 0 1-2 2H7"/><path d="m10 10.5-3.5 3.5 3.5 3.5"/></svg></kbd>Valider</span>
            <span id="hint-back" class="hint"><kbd>⌫</kbd>Retour</span>
            <span class="hint hint-end"><kbd>ESC</kbd>Fermer</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
