<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablette GPS — Aperçu</title>
<style>
:root {
    --accent: #8b5cf6;
    --accent-light: #a47dff;
    --accent-glow: rgba(139, 92, 246, 0.45);
    --screen-top: #1d1e22;
    --screen-bottom: #16171a;
    --surface: rgba(255, 255, 255, 0.04);
    --surface-hover: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --text-subtle: #75757f;
    --online: #4ade80;
    --danger: #e0607e;
    --warning: #fbbf24;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    user-select: none;
    overflow: hidden;
}

.hidden { display: none !important; }

#tablet {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
}

.frame {
    width: 760px; height: 520px;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--screen-top), var(--screen-bottom));
    border: 10px solid #0c0c0e;
    border-radius: 26px;
    box-shadow: 0 0 0 1px var(--border), 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px var(--accent-glow);
    overflow: hidden;
    animation: rise 0.25s ease-out;
}

@keyframes rise { from { transform: translateY(30px); opacity: 0; } }

header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px 12px;
}

.brand { display: flex; align-items: center; gap: 14px; }
.brand h1 { font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
.brand p { font-size: 12px; color: var(--text-muted); }

.pulse {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 0 var(--accent-glow);
    animation: pulse 1.6s infinite;
}
@keyframes pulse { 70% { box-shadow: 0 0 0 12px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

.icon-btn {
    width: 32px; height: 32px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }

nav { display: flex; gap: 6px; padding: 0 22px 12px; border-bottom: 1px solid var(--border); }

.tab {
    padding: 8px 14px; border-radius: 10px; border: 0;
    background: transparent; color: var(--text-muted);
    font-size: 13px; cursor: pointer;
}
.tab:hover { background: var(--surface); }
.tab.active { background: var(--surface-hover); color: var(--text); }

.badge {
    margin-left: 6px; padding: 1px 7px; border-radius: 99px;
    background: var(--surface-hover); font-size: 11px;
}
.badge.alert:not(:empty):not([data-zero]) { background: var(--accent); color: white; }

main { flex: 1; overflow-y: auto; padding: 16px 22px; }
main::-webkit-scrollbar { width: 6px; }
main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.panel { display: flex; flex-direction: column; gap: 10px; }

.card {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--border);
}

.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-subtle); flex-shrink: 0; }
.dot.on { background: var(--online); box-shadow: 0 0 10px var(--online); animation: blink 1s infinite; }
.dot.warn { background: var(--warning); }
@keyframes blink { 50% { opacity: 0.35; } }

.info { flex: 1; min-width: 0; }
.info strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info span { font-size: 12px; color: var(--text-muted); }

.actions { display: flex; gap: 6px; }

.btn {
    padding: 7px 12px; border-radius: 9px; border: 0;
    background: var(--accent); color: white;
    font-size: 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--accent-light); }
.btn.ghost { background: var(--surface-hover); color: var(--text); }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.12); }
.btn.danger { background: var(--danger); }

.switch {
    position: relative; width: 42px; height: 24px; border-radius: 99px;
    background: var(--surface-hover); border: 1px solid var(--border); cursor: pointer;
}
.switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--text-muted);
    transition: transform 0.2s, background 0.2s;
}
.switch.on { background: rgba(139, 92, 246, 0.35); border-color: var(--accent); }
.switch.on::after { transform: translateX(18px); background: white; }

.empty {
    padding: 40px 10px; text-align: center;
    color: var(--text-subtle); font-size: 13px; line-height: 1.6;
}

.log { font-size: 13px; }
.log time { display: block; font-size: 11px; color: var(--text-subtle); margin-bottom: 2px; }

.modal {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.45);
}
.modal-box {
    width: 360px; padding: 20px; border-radius: 16px;
    background: var(--screen-top); border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.modal-box h2 { font-size: 16px; margin-bottom: 8px; }
.modal-box p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.modal-box input {
    width: 100%; margin-top: 12px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 14px; outline: none;
}
.modal-box input:focus { border-color: var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.toast {
    position: fixed; bottom: calc(50% - 300px);
    padding: 9px 16px; border-radius: 10px;
    background: var(--screen-top); border: 1px solid var(--accent);
    font-size: 13px;
}
.toast.error { border-color: var(--danger); }


body.preview {
    background:
        radial-gradient(2px 2px at 12% 30%, #ffcf8a, transparent), radial-gradient(3px 3px at 82% 22%, #ff5f7a, transparent),
        radial-gradient(160px 90px at 20% 75%, rgba(255,140,60,.25), transparent), radial-gradient(220px 120px at 85% 70%, rgba(139,92,246,.25), transparent),
        radial-gradient(400px 200px at 50% 110%, rgba(34,211,238,.15), transparent),
        linear-gradient(180deg, #06060c 0%, #140d24 55%, #1b1220 100%);
}
body.preview::before {
    content: ''; position: fixed; inset: auto 0 0 0; height: 45%;
    background: repeating-linear-gradient(90deg, #0c0b14 0 70px, #120f1c 70px 130px, #0a0910 130px 175px);
    clip-path: polygon(0 40%, 6% 40%, 6% 10%, 14% 10%, 14% 35%, 22% 35%, 22% 0, 30% 0, 30% 30%, 40% 30%, 40% 15%, 52% 15%, 52% 38%, 62% 38%, 62% 5%, 70% 5%, 70% 28%, 80% 28%, 80% 12%, 90% 12%, 90% 34%, 100% 34%, 100% 100%, 0 100%);
    filter: blur(1.5px); opacity: .9;
}
#demo {
    position: fixed; top: 16px; left: 16px; z-index: 50; display: flex; flex-direction: column; gap: 6px; max-width: 260px;
    font-family: 'Segoe UI', sans-serif;
}
#demo b { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #a1a1aa; }
#demo button {
    text-align: left; padding: 8px 11px; border-radius: 9px; font-size: 12px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.12); background: rgba(20,20,28,.85); color: #f4f4f5;
}
#demo button:hover { border-color: #8b5cf6; }
@media (max-width: 820px) {
    #demo { position: static; max-width: none; margin: 12px; }
    #tablet { position: relative; padding: 12px; }
    .frame { width: 100%; height: 520px; }
}

</style>
</head>
<body class="preview">
<div id="demo">
    <b>Simulation</b>
    <button onclick="__addTracker(false)">+ Nouveau traceur dans la poche</button>
    <button onclick="__addTracker(true)">+ Traceur ramassé (actif chez un autre)</button>
    <button onclick="__forced()">Un autre joueur force la déconnexion d'un de mes traceurs</button>
    <button onclick="__open()">Rouvrir la tablette</button>
</div>
<div id="tablet" class="hidden">
        <div class="frame">
            <header>
                <div class="brand">
                    <span class="pulse"></span>
                    <div>
                        <h1>GPS Tracker</h1>
                        <p>Outil de suivi des traceurs</p>
                    </div>
                </div>
                <button class="icon-btn" data-close title="Fermer">✕</button>
            </header>

            <nav>
                <button class="tab active" data-tab="mine">Mes trackers <span class="badge" id="count-mine">0</span></button>
                <button class="tab" data-tab="pocket">Synchroniser <span class="badge alert" id="count-pocket">0</span></button>
                <button class="tab" data-tab="log">Journal <span class="badge" id="count-log">0</span></button>
            </nav>

            <main>
                <section id="tab-mine" class="panel"></section>
                <section id="tab-pocket" class="panel hidden"></section>
                <section id="tab-log" class="panel hidden"></section>
            </main>
        </div>

        <div id="modal" class="modal hidden">
            <div class="modal-box">
                <h2 id="modal-title"></h2>
                <p id="modal-text"></p>
                <input id="modal-input" class="hidden" type="text" spellcheck="false">
                <div class="modal-actions">
                    <button class="btn ghost" id="modal-cancel">Annuler</button>
                    <button class="btn" id="modal-ok">Valider</button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast hidden"></div>
    </div>
    <script>
// ─── Serveur simulé (remplace les callbacks Lua dans l'aperçu) ───────────
(function () {
    const db = {
        trackers: [
            { serial: 'E04B', owner: 'me', name: 'Sultan de Marco', active: true, location: 'world' },
            { serial: '19D2', owner: 'me', name: null, active: false, location: 'pocket' },
            { serial: 'A3F9', owner: null, active: false, location: 'pocket', slot: 4 },
            { serial: '7C21', owner: 'other', active: true, location: 'pocket', slot: 5 },
        ],
        messages: [{ text: 'Tracker #5B10 a été détruit (signal perdu).', time: Math.floor(Date.now() / 1000) - 3600 }],
    };
    const label = (t) => t.name ? `Tracker : ${t.name}` : `Tracker #${t.serial}`;
    const data = () => ({
        mine: db.trackers.filter((t) => t.owner === 'me').map((t) => ({ ...t, label: label(t) })),
        pocket: db.trackers.filter((t) => t.owner !== 'me' && t.slot).map((t) => ({
            slot: t.slot, serial: t.serial, status: !t.owner ? 'new' : t.active ? 'active' : 'foreign',
        })),
        messages: db.messages,
    });
    const send = (msg) => window.dispatchEvent(new MessageEvent('message', { data: msg }));
    const update = () => send({ action: 'update', data: data() });
    const find = (s) => db.trackers.find((t) => t.serial === s);
    let nextSlot = 6;

    const routes = {
        close: () => { send({ action: 'close' }); setTimeout(() => window.__open(), 900); return 1; },
        toggle: (b) => { const t = find(b.serial); t.active = !t.active; update(); return 1; },
        rename: (b) => { const t = find(b.serial); t.name = b.name.trim().slice(0, 24) || null; update(); return 1; },
        forget: (b) => { const t = find(b.serial); t.owner = null; t.active = false; t.slot = t.location === 'pocket' ? nextSlot++ : null; update(); return 1; },
        sync: (b) => {
            const t = db.trackers.find((x) => x.slot === b.slot);
            if (!t) return { ok: false, message: 'Traceur introuvable dans ta poche.' };
            if (t.owner && t.active && !b.force) return { ok: false, needForce: true };
            Object.assign(t, { owner: 'me', active: false, name: null, slot: null });
            setTimeout(update, 0);
            return { ok: true, message: `Traceur #${t.serial} synchronisé.` };
        },
    };
    window.fetch = async (url, opts) => {
        const name = String(url).split('/').pop();
        const body = opts && opts.body ? JSON.parse(opts.body) : {};
        const res = routes[name] ? routes[name](body) : 1;
        return { json: async () => res };
    };
    window.GetParentResourceName = () => 'originrp_tracker';

    window.__open = () => send({ action: 'open', data: data(), maxName: 24 });
    window.__addTracker = (stolen) => {
        const serial = Math.floor(Math.random() * 0xffff).toString(16).toUpperCase().padStart(4, '0');
        db.trackers.push({ serial, owner: stolen ? 'other' : null, active: !!stolen, location: 'pocket', slot: nextSlot++ });
        update();
    };
    window.__forced = () => {
        const t = db.trackers.find((x) => x.owner === 'me');
        if (!t) return;
        t.owner = 'other';
        send({ action: 'message', message: { text: `Tracker ${t.name || '#' + t.serial} a été déconnecté de force pour être synchronisé sur un autre appareil.`, time: Math.floor(Date.now() / 1000) } });
        db.messages.unshift({ text: `Tracker ${t.name || '#' + t.serial} a été déconnecté de force pour être synchronisé sur un autre appareil.`, time: Math.floor(Date.now() / 1000) });
        update();
    };
})();

</script>
<script>
const $ = (sel) => document.querySelector(sel);
const resource = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'originrp_tracker';

let state = { mine: [], pocket: [], messages: [] };
let maxName = 24;

function post(name, body = {}) {
    return fetch(`https://${resource}/${name}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(body),
    }).then((r) => r.json()).catch(() => null);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text ?? '';
    return div.innerHTML;
}

let toastTimer;
function toast(text, kind) {
    const el = $('#toast');
    el.textContent = text;
    el.className = `toast ${kind || ''}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 3500);
}

// ─── Modale (confirmation / saisie) ───────────────────────────────────────
function modal({ title, text, input, okLabel = 'Valider', danger = false }) {
    return new Promise((resolve) => {
        $('#modal-title').textContent = title;
        $('#modal-text').textContent = text || '';
        const field = $('#modal-input');
        field.classList.toggle('hidden', input === undefined);
        field.value = input ?? '';
        field.maxLength = maxName;
        const ok = $('#modal-ok');
        ok.textContent = okLabel;
        ok.className = danger ? 'btn danger' : 'btn';
        $('#modal').classList.remove('hidden');
        if (input !== undefined) setTimeout(() => field.focus(), 30);

        const done = (value) => {
            $('#modal').classList.add('hidden');
            ok.onclick = null; $('#modal-cancel').onclick = null; field.onkeydown = null;
            resolve(value);
        };
        ok.onclick = () => done(input !== undefined ? field.value : true);
        $('#modal-cancel').onclick = () => done(null);
        field.onkeydown = (e) => { if (e.key === 'Enter') ok.onclick(); };
    });
}

// ─── Rendu ────────────────────────────────────────────────────────────────
const LOCATIONS = { world: 'Posé / collé', pocket: 'Dans une poche', lost: 'Signal perdu' };

function renderMine() {
    const el = $('#tab-mine');
    if (!state.mine.length) {
        el.innerHTML = `<div class="empty">Aucun traceur synchronisé.<br>Mets un traceur dans ta poche puis va dans l'onglet « Synchroniser ».</div>`;
        return;
    }
    el.innerHTML = state.mine.map((t) => `
        <div class="card">
            <span class="dot ${t.active ? 'on' : ''}"></span>
            <div class="info">
                <strong>${escapeHtml(t.label)}</strong>
                <span>#${t.serial} · ${t.active ? 'Actif' : 'Désactivé'} · ${LOCATIONS[t.location] || ''}</span>
            </div>
            <div class="actions">
                <button class="btn ghost" data-rename="${t.serial}">Renommer</button>
                <button class="btn ghost" data-forget="${t.serial}" title="Désynchroniser">✕</button>
            </div>
            <div class="switch ${t.active ? 'on' : ''}" data-toggle="${t.serial}" title="${t.active ? 'Désactiver' : 'Activer'}"></div>
        </div>`).join('');
}

function renderPocket() {
    const el = $('#tab-pocket');
    if (!state.pocket.length) {
        el.innerHTML = `<div class="empty">Aucun traceur non synchronisé détecté dans ta poche.</div>`;
        return;
    }
    el.innerHTML = state.pocket.map((t) => `
        <div class="card">
            <span class="dot ${t.status === 'active' ? 'warn' : ''}"></span>
            <div class="info">
                <strong>Traceur #${t.serial}</strong>
                <span>${t.status === 'new' ? 'Nouveau traceur détecté' : t.status === 'active' ? 'Déjà actif sur un autre appareil' : 'Lié à un autre appareil (inactif)'}</span>
            </div>
            <button class="btn" data-sync="${t.slot}">Synchroniser</button>
        </div>`).join('');
}

function renderLog() {
    const el = $('#tab-log');
    if (!state.messages.length) {
        el.innerHTML = `<div class="empty">Aucune notification.</div>`;
        return;
    }
    el.innerHTML = state.messages.map((m) => `
        <div class="card log">
            <div class="info">
                <time>${new Date(m.time * 1000).toLocaleString('fr-FR')}</time>
                ${escapeHtml(m.text)}
            </div>
        </div>`).join('');
}

function render() {
    renderMine(); renderPocket(); renderLog();
    $('#count-mine').textContent = state.mine.length;
    const pocket = $('#count-pocket');
    pocket.textContent = state.pocket.length;
    pocket.toggleAttribute('data-zero', state.pocket.length === 0);
    $('#count-log').textContent = state.messages.length;
}

function showTab(name) {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('hidden', p.id !== `tab-${name}`));
}

// ─── Actions ──────────────────────────────────────────────────────────────
async function sync(slot) {
    let res = await post('sync', { slot });
    if (res && res.needForce) {
        const yes = await modal({
            title: 'Traceur déjà actif',
            text: 'Ce tracker est déjà actif. Voulez-vous forcer la déconnexion ?',
            okLabel: 'Oui, forcer',
            danger: true,
        });
        if (!yes) return;
        res = await post('sync', { slot, force: true });
    }
    if (res && res.message) toast(res.message, res.ok ? '' : 'error');
    if (res && res.ok) showTab('mine');
}

document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-tab],[data-toggle],[data-rename],[data-forget],[data-sync],[data-close]');
    if (!t) return;
    if (t.dataset.tab) showTab(t.dataset.tab);
    else if (t.dataset.toggle) post('toggle', { serial: t.dataset.toggle });
    else if (t.dataset.sync) sync(Number(t.dataset.sync));
    else if (t.dataset.rename) {
        const tracker = state.mine.find((x) => x.serial === t.dataset.rename);
        const name = await modal({
            title: 'Renommer le traceur',
            text: 'Il apparaîtra sur la carte sous « Tracker : nom ».',
            input: tracker?.name || '',
        });
        if (name !== null) post('rename', { serial: t.dataset.rename, name });
    } else if (t.dataset.forget) {
        const yes = await modal({ title: 'Désynchroniser', text: 'Retirer ce traceur de ta tablette ?', okLabel: 'Retirer', danger: true });
        if (yes) post('forget', { serial: t.dataset.forget });
    } else if (t.hasAttribute('data-close')) post('close');
});

document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#modal').classList.contains('hidden')) $('#modal-cancel').click();
    else post('close');
});

window.addEventListener('message', ({ data }) => {
    switch (data.action) {
        case 'open':
            state = data.data; maxName = data.maxName || 24;
            render();
            showTab(state.pocket.length ? 'pocket' : 'mine');
            $('#tablet').classList.remove('hidden');
            break;
        case 'update':
            state = data.data; render();
            break;
        case 'message':
            state.messages.unshift(data.message); render();
            toast(data.message.text, 'error');
            break;
        case 'close':
            $('#tablet').classList.add('hidden');
            $('#modal').classList.add('hidden');
            break;
    }
});

</script>
<script>__open();</script>
</body>
</html>
