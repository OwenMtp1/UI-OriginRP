    <article id="card" class="idcard hidden" data-position="right">
        <!-- Grand sceau en filigrane -->
        <svg class="seal" aria-hidden="true"><use href="#great-seal"/></svg>

        <header class="id-header">
            <svg class="id-emblem" aria-hidden="true"><use href="#great-seal"/></svg>
            <div class="id-heading">
                <p class="id-state">State of San Andreas</p>
                <h1 class="id-county">Los Santos County</h1>
                <p class="id-dept">Department of Administration</p>
            </div>
            <div class="id-type">
                <span>Carte d'identité</span>
                <small>Identity card</small>
            </div>
        </header>

        <section class="id-body">
            <div class="id-photo-col">
                <div class="id-photo">
                    <img id="id-photo-img" alt="">
                    <svg class="id-photo-empty" viewBox="0 0 100 120" aria-hidden="true">
                        <circle cx="50" cy="44" r="20"/>
                        <path d="M14 120c0-24 16-40 36-40s36 16 36 40z"/>
                    </svg>
                </div>
                <p id="id-signature" class="id-signature"></p>
            </div>

            <dl class="id-fields">
                <div><dt>Nom</dt><dd id="f-lastname"></dd></div>
                <div><dt>Prénom</dt><dd id="f-firstname"></dd></div>
                <div><dt>Sexe</dt><dd id="f-sex"></dd></div>
                <div><dt>Date de naissance</dt><dd id="f-birthdate"></dd></div>
                <div><dt>Taille</dt><dd id="f-height"></dd></div>
                <div><dt>Lieu de naissance</dt><dd id="f-birthplace"></dd></div>
            </dl>
        </section>

        <footer class="id-footer">
            <div id="row-created"><span>Date de création</span><strong id="f-created"></strong></div>
            <div id="row-number" class="id-number"><span>N°</span><strong id="f-number"></strong></div>
        </footer>

        <div id="id-mrz" class="id-mrz"></div>
        <div class="id-holo" aria-hidden="true"></div>
    </article>

    <script src="script.js"></script>
</body>
</html>
