<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OriginRP Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notif" class="notif" data-type="info" data-position="top-right" role="status" aria-live="polite">
        <div class="notif-progress"><i id="notif-bar"></i></div>
        <!-- Logo Origin -->
        <div id="notif-logo" class="notif-logo">
            <svg viewBox="0 0 40 32" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <defs>
                    <linearGradient id="logo-r" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#b596ff"/>
                        <stop offset="1" stop-color="#7c4dff"/>
                    </linearGradient>
                </defs>
                <path stroke="#f4f1fb" stroke-width="3.6" d="M30 25 20.6 12.2A7.6 7.6 0 1 0 20.2 21.6"/>
                <path stroke="url(#logo-r)" stroke-width="3.6" d="M24.6 11.4A5.6 5.6 0 1 1 30.2 19L35 25"/>
            </svg>
        </div>
        <div class="notif-body">
            <p class="notif-title">
                <span id="notif-icon" class="notif-icon"></span>
                <span id="notif-title" class="notif-title-text"></span>
                <em id="notif-count" class="notif-count"></em>
            </p>
            <p id="notif-message" class="notif-message"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
