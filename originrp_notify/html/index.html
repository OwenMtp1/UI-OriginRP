<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OriginRP Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notif" class="notif" data-type="info" data-position="top-right" role="status" aria-live="polite">
        <div id="notif-icon" class="notif-icon"></div>
        <div class="notif-text">
            <p class="notif-title"><span id="notif-title"></span><em id="notif-count" class="notif-count"></em></p>
            <p id="notif-message" class="notif-message"></p>
        </div>
        <div class="notif-progress"><i id="notif-bar"></i></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
